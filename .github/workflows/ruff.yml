# CI for ruff check. Runs ruff check across all Python products.
name: ruff-check

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/ruff.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/ruff.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned: an unpinned ruff picks up new rules on release and turns CI
        # red with no change in this repository.
        run: pip install ruff==0.17.2
      - name: Run ruff check
        run: ruff check .