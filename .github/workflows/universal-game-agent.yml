# CI for universal-game-agent. See ../CI.md for what CI does and does not validate.
# CPU only. External-game tests use fakes; no window, GPU, or live game runs here.
name: universal-game-agent

on:
  push:
    paths:
      - "universal-game-agent/**"
      - ".github/workflows/universal-game-agent.yml"
      - ".github/CI.md"
  pull_request:
    paths:
      - "universal-game-agent/**"
      - ".github/workflows/universal-game-agent.yml"
      - ".github/CI.md"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-game-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run universal-game-agent test suite
        run: python -m unittest discover -s tests

  # Same suite with the optional Atari extra (ale-py bundles its ROMs), so the
  # ALE adapter, explicit-reset and pixel-only tests run instead of skipping.
  # The plain job above proves they skip cleanly without ale-py. No Pillow.
  tests-atari:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-game-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime + Atari dependencies
        run: python -m pip install -r requirements.txt -r requirements-atari.txt
      - name: Fail if ale-py cannot load a bundled ROM
        run: python -c "from ale_py import ALEInterface, roms; ALEInterface().loadROM(roms.get_rom_path('pong'))"
      - name: Run universal-game-agent test suite with ALE tests enabled
        run: python -m unittest discover -s tests
