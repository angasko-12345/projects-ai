# Offline tests for the histyt production pipeline. Provider tests use fakes;
# no upload credentials or live API calls are required.
name: history-yt

on:
  push:
    paths:
      - "history-yt/**"
      - ".github/workflows/history-yt.yml"
      - ".github/CI.md"
  pull_request:
    paths:
      - "history-yt/**"
      - ".github/workflows/history-yt.yml"
      - ".github/CI.md"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: history-yt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=3 -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install the project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run histyt tests
        run: python -m pytest tests -q
