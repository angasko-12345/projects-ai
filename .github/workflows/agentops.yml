# CI for agentops. See ../CI.md for what CI does and does not validate.
name: agentops

on:
  push:
    paths:
      - "agentops/**"
      - ".github/workflows/agentops.yml"
      - ".github/CI.md"
      - "acceptance_test.py"
  pull_request:
    paths:
      - "agentops/**"
      - ".github/workflows/agentops.yml"
      - ".github/CI.md"
      - "acceptance_test.py"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run agentops test suite
        run: python -m unittest discover -s tests
      - name: Run Issue #4 acceptance scenarios
        # End-to-end WorkflowEngine runs with scripted agents: clean success,
        # verification repair, review-rejection repair, persistent rejection,
        # cancellation. Exits non-zero if any scenario fails.
        working-directory: .
        run: python acceptance_test.py
