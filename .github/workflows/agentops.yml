# CI for agentops. See ../CI.md for what CI does and does not validate.
name: agentops

on:
  push:
    paths:
      - "agentops/**"
      - ".github/workflows/agentops.yml"
      - ".github/CI.md"
      - "acceptance_test.py"
  pull_request:
    paths:
      - "agentops/**"
      - ".github/workflows/agentops.yml"
      - ".github/CI.md"
      - "acceptance_test.py"

permissions:
  contents: read

jobs:
  # The plain job below has no PySide6, so every @requires_qt desktop-client
  # test is skipped there. This job installs the optional
  # desktop dependency and runs the whole suite on Qt's offscreen platform,
  # so the GUI tests run in CI instead of only on a developer machine.
  gui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agentops
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install the desktop extra (PySide6)
        # Same floor as the `desktop` extra in agentops/pyproject.toml.
        run: python -m pip install "PySide6>=6.5"
      - name: Fail if PySide6 cannot start offscreen
        # A broken install must fail here, not silently re-skip the GUI tests.
        run: python -c "from PySide6.QtWidgets import QApplication; QApplication([])"
      - name: Run agentops test suite with the GUI tests enabled
        run: python -m unittest discover -s tests

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run agentops test suite
        run: python -m unittest discover -s tests
      - name: Run Issue #4 acceptance scenarios
        # End-to-end WorkflowEngine runs with scripted agents: clean success,
        # verification repair, review-rejection repair, persistent rejection,
        # cancellation. Exits non-zero if any scenario fails.
        working-directory: .
        run: python acceptance_test.py
