  #replay.show{opacity:1;pointer-events:auto}
  #replayBtn{display:flex;align-items:center;gap:10px;font:700 12px/1 "Space Mono",monospace;letter-spacing:.28em;

    color:#f2efe6;background:rgba(14,14,12,.82);border:1px solid rgba(242,239,230,.35);border-radius:999px;
    cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .15s}
  .ctlBtn:active{transform:scale(.94)}

  #blockMsg .bmBody{font:400 12px/1.9 "Space Mono",monospace;letter-spacing:.06em;color:rgba(242,239,230,.62)}
  #silentBtn{pointer-events:auto;margin-top:4px;font:700 11px/1 "Space Mono",monospace;letter-spacing:.26em;
    padding:14px 26px;min-height:44px;color:#0e0e0c;background:#ff4a1c;border:none;border-radius:999px;
    cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .18s}

  /* audio diagnostics panel — the "prove it" instrument */
  #diag{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:7;
    display:none;flex-direction:column;gap:10px;background:rgba(14,14,12,.97);
    border:1px solid rgba(255,74,28,.75);padding:16px 18px;width:min(350px,92vw);

    -webkit-tap-highlight-color:transparent}
  #diag.open{display:flex}
  #diag .dTitle{font-weight:700;letter-spacing:.22em;color:#ff4a1c;font-size:12px}
  #diag .row{display:flex;justify-content:space-between;gap:12px}

  #diag .verdict{border-top:1px solid rgba(242,239,230,.22);padding-top:8px;color:#ff4a1c;letter-spacing:.03em}
  #diag .flash{color:#f2efe6;background:rgba(255,74,28,.22);padding:6px 8px;margin-top:2px}

  #diag button:active{transform:scale(.95)}

<body>

         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
    </svg>
    <span>REPLAY</span>
  </button>
  <span class="hint">tap or space to play · M mute · A diagnostics · auto-tuned to your device</span>

<script>
/* ============================================================
   REEL 002 — GLM-5.3 · a self-portrait (director's cut)
   128 BPM · 20 bars · 80 beats · exactly 37.500 s

   THIS BUILD — "PROVE IT":
   · the mute toggle is now un-mistakable (a mis-labeled
     "SOUND ON" toggle could silently mute the film — fixed:
     explicit state labels, a persistent MUTED chip, an
     unmute confirmation blip, and the volume stage is
     visible live in diagnostics)
   · the film opens with a SLATE CLAP at frame zero —
     audible proof of sound within 0.15s of the tap
   · ♪ TEST TONE bypasses the entire film graph, straight
     to the hardware: if the beep is silent, the viewer is
     blocking audio; if it beeps but the film is silent,
     the bug is mine and the panel will show it
   · AUDIO DIAGNOSTICS panel (A key / DIAG / auto-open on
     failure): context state, rate, latency, mute stage,
     event count, live bus meter, embedded-viewer detection,
     and a plain-language verdict
   · HUD carries a live output meter; silent/muted/blocked
     states are labelled, never assumed
   ============================================================ */

const INK='#0e0e0c', PAPER='#f2efe6', ORANGE='#ff4a1c';
const W=1920, H=1080, DUR=37.5, BEAT=0.46875; // 60/128

/* ============================================================
   DEVICE INTELLIGENCE
   ============================================================ */
const DEV=(()=>{
  const ua=navigator.userAgent||'';
  const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0||
    (window.matchMedia&&matchMedia('(pointer:coarse)').matches);
  const isMobile=isIOS||isAndroid||(isTouch&&Math.min(screen.width,screen.height)<820);
  const platform=isIOS?'ios':isAndroid?'android':isMobile?'mobile':'desktop';
  const cores=navigator.hardwareConcurrency||(isMobile?4:8);
  const memGB=(typeof navigator.deviceMemory==='number')?navigator.deviceMemory:null;
  const conn=(navigator.connection||navigator.mozConnection||navigator.webkitConnection)||null;
  const saveData=!!(conn&&conn.saveData);
  const reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const dprSpec=Math.round((window.devicePixelRatio||1)*100)/100;
  let tier;
  if(!isMobile)tier=cores>=4?'high':'mid';
  else if(cores>=6&&(memGB===null||memGB>=4))tier='high';
  else if(cores>=4)tier='mid';
  else tier='low';
  return{isIOS,isAndroid,isTouch,isMobile,platform,cores,memGB,saveData,reduced,
    dprSpec,screenW:screen.width,screenH:screen.height,tier,
    profileLabel:platform+' · '+tier};
})();

/* embedded-viewer detection: iframes without allow="autoplay"
   silently block audio — the #1 environmental cause of "no sound" */
const isFramed=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();

const Q={
  dprCap: DEV.tier==='high'?(DEV.isMobile?1.75:2):DEV.tier==='mid'?1.5:1.2,
  dprFloor:.75,
  parts:  DEV.tier==='high'?640:DEV.tier==='mid'?440:300,
  rings:  DEV.tier==='high'?40:DEV.tier==='mid'?32:24,
  scopeNP:DEV.tier==='high'?560:DEV.tier==='mid'?430:330,
  rays:   DEV.tier==='high'?36:DEV.tier==='mid'?28:20,
  grainA: DEV.tier==='low'?.34:.5,
  fontsMs:DEV.isMobile?2200:1500,
  audioProbeMs:1100,
};

/* the future-events gate for mid-film audio joins */
let minEv=-Infinity;

/* ---------- tiny math / easing kit ---------- */
const clamp01=x=>x<0?0:x>1?1:x;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const norm=(t,a,b)=>clamp01((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const eoc=t=>1-Math.pow(1-t,3);
const eic=t=>t*t*t;
const eox=t=>t>=1?1:1-Math.pow(2,-10*t);
const eix=t=>t<=0?0:Math.pow(2,10*(t-1));
const eioc=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=(t,s=1.70158)=>{const c=s+1;t=clamp01(t);return 1+c*Math.pow(t-1,3)+s*Math.pow(t-1,2);};
const elast=t=>{t=clamp01(t);return t===0||t===1?t:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let z=Math.imul(seed^seed>>>15,1|seed);
  z=z+Math.imul(z^z>>>7,61|z)^z;return((z^z>>>14)>>>0)/4294967296;};}

/* ---------- canvas & adaptive resolution ---------- */
const cv=document.getElementById('stage'), ctx=cv.getContext('2d');
let cw=0,ch=0;
let dpr=Math.min(Q.dprCap,window.devicePixelRatio||1);
function resize(){
  cw=window.innerWidth;ch=window.innerHeight;
  cv.width=Math.max(2,Math.round(cw*dpr));cv.height=Math.max(2,Math.round(ch*dpr));
  cv.style.width=cw+'px';cv.style.height=ch+'px';
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,80));
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
resize();

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};}

const grainTile=document.createElement('canvas');grainTile.width=grainTile.height=140;
{const g=grainTile.getContext('2d'),im=g.createImageData(140,140),d=im.data;
 for(let i=0;i<d.length;i+=4){const v=Math.random()<.5?0:255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=Math.random()*58;}
 g.putImageData(im,0,0);}
const grainPat=ctx.createPattern(grainTile,'repeat');

/* ---------- draw helpers (metric caching) ---------- */
const metricCache={mono:new Map(),fit:new Map(),geo:new Map()};
let goDotCache=null;
function clearMetrics(){metricCache.mono.clear();metricCache.fit.clear();metricCache.geo.clear();goDotCache=null;}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(clearMetrics);

function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function drawTri(x,y,s){ctx.beginPath();ctx.moveTo(x,y-s*.58);ctx.lineTo(x+s*.5,y+s*.29);
  ctx.lineTo(x-s*.5,y+s*.29);ctx.closePath();ctx.fill();}
function edgeStroke(ax,ay,bx,by,p){
  if(p<=0)return;p=Math.min(1,p);
  line(ax,ay,ax+(bx-ax)*p,ay+(by-ay)*p);}

function monoW(size,bold){
  const key=(bold?'b':'r')+size;
  let w=metricCache.mono.get(key);
  if(w===undefined){
    ctx.save();ctx.font=(bold?'700 ':'400 ')+size+'px "Space Mono", monospace';
    w=ctx.measureText('M').width;ctx.restore();
    metricCache.mono.set(key,w);
  }
  return w;
}
function monoText(str,x,y,{size=22,track=6,align='left',alpha=1,color=INK,bold=false}={}){
  ctx.save();
  ctx.font=(bold?'700 ':'400 ')+size+'px "Space Mono", monospace';
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const cwCh=monoW(size,bold);
  const tot=cwCh*str.length+track*(str.length-1);
  let sx=align==='center'?x-tot/2:align==='right'?x-tot:x;
  ctx.globalAlpha*=alpha;ctx.fillStyle=color;
  for(const ch of str){ctx.fillText(ch,sx,y);sx+=cwCh+track;}
  ctx.restore();
}
function eachLetter(str,px,track,cx,cb){
  const key=str+'|'+px+'|'+track;
  let ws=metricCache.geo.get(key);
  if(!ws){
    ctx.save();ctx.font=px+'px Anton, Impact, sans-serif';
    ws=[...str].map(c=>ctx.measureText(c).width);ctx.restore();
    metricCache.geo.set(key,ws);
  }
  const tot=ws.reduce((a,b)=>a+b,0)+track*(str.length-1);
  let x=cx-tot/2;
  for(let i=0;i<str.length;i++){cb(i,x+ws[i]/2,tot);x+=ws[i]+track;}
  return tot;
}
function fitAnton(str,target,track){
  const key=str+'|'+target+'|'+track;
  let px=metricCache.fit.get(key);
  if(px===undefined){
    ctx.save();ctx.font='100px Anton, Impact, sans-serif';
    const w=[...str].reduce((a,c)=>a+ctx.measureText(c).width,0);ctx.restore();
    px=100*Math.max(20,target-track*(str.length-1))/Math.max(1,w);
    metricCache.fit.set(key,px);
  }
  return px;
}
function wrapChars(str,maxCh){
  const words=str.split(' '),lines=[];let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(t.length<=maxCh||!cur)cur=t;else{lines.push(cur);cur=w;}
  }
  if(cur)lines.push(cur);return lines;
}
function idleLine(str,y,{size,track=5,alpha=1,color=PAPER,bold=false}={}){
  const mw=monoW(size,bold);
  const maxCh=Math.max(8,Math.floor((cw*.92+track)/(mw+track)));
  const lines=wrapChars(str,maxCh),lh=size*1.8;
  lines.forEach((L,i)=>monoText(L,cw/2,y+i*lh,{size,track,align:'center',alpha,color,bold}));
  return y+lines.length*lh;
}

/* ---------- wavelength → RGB ---------- */
function wl2rgb(w){
  w=Math.max(380,Math.min(700,w));
  let r=0,g=0,b=0;
  if(w<440){r=(440-w)/60;b=1;}
  else if(w<490){g=(w-440)/50;b=1;}
  else if(w<510){g=1;b=(510-w)/20;}
  else if(w<580){r=(w-510)/70;g=1;}
  else if(w<645){r=1;g=(645-w)/65;}
  else r=1;
  let f=1;
  if(w<420)f=.3+.7*(w-380)/40;
  else if(w>660)f=.3+.7*(700-w)/40;
  return [Math.round(255*r*f),Math.round(255*g*f),Math.round(255*b*f)];
}
const css=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ---------- deterministic particles ---------- */
const BURST=(()=>{const R=mulberry(7),a=[];
  for(let i=0;i<110;i++)a.push({x:960+(R()-.5)*1350,y:540+(R()-.5)*380,ang:R()*6.2832,
    spd:280+R()*1350,sz:3+R()*7,sq:R()<.42,d:R()*.06,col:R()<.32?ORANGE:INK});
  return a;})();
const DUST=(()=>{const R=mulberry(99),a=[];
  for(let i=0;i<16;i++){const x=960+(R()-.5)*1250;
    a.push({x,vx:(x>960?1:-1)*(90+R()*520),vy:-(70+R()*360),r:2.5+R()*5.5,
      life:.45+R()*.2,col:R()<.3?ORANGE:INK});}
  return a;})();
const GC=17,GR=9;
const J=(()=>{const R=mulberry(1234);
  return Array.from({length:GR},()=>Array.from({length:GC},()=>R()));})();

/* ---------- camera shake ---------- */
const SHAKES=[[1.875,1],[2.8125,.4],[3.75,.4],[4.6875,.15],[5.15625,.85],[5.625,.8],[6.5625,.2],
  [7.5,.85],[7.96875,.25],[8.4375,.25],[9.375,.65],[10.3125,.3],[11.25,1],[11.71875,.65],[12.1875,.65],
  [12.65625,.5],[12.890625,.5],[13.125,1],[13.59375,.2],[14.0625,.25],[14.53125,.25],[15,.25],[15.46875,.25],
  [15.9375,.3],[16.875,.9],[17.34375,.15],[17.8125,.2],[18.28125,.15],[18.75,.2],[19.21875,.15],[19.6875,.25],
  [20.15625,.2],[20.625,.9],[21.5625,.85],[22.5,.25],[23.4375,.25],[24.375,.35],[24.84375,.3],[25.3125,.3],
  [25.78125,.3],[26.1328125,1],[28.125,1],
  [30.46875,.3],[30.9375,.3],[31.40625,.3],[31.875,.45],[32.34375,.3],[32.8125,.3],[33.28125,.85],
  [35.625,1.05],[37.03125,.25]];
const SHAKE_MUL=DEV.reduced?.25:1;
function shake(t){let x=0,y=0;
  SHAKES.forEach(([ti,m],i)=>{const dt=t-ti;
    if(dt>0&&dt<.5){const a=m*16*SHAKE_MUL*Math.exp(-dt*8.5);x+=a*Math.sin(dt*72+i*2.1);y+=a*Math.sin(dt*63+i*1.3+1);}});
  return{x,y};}

/* ---------- haptics ---------- */
const HAPTICS=[[1.875,40],[5.15625,15],[5.625,40],[11.25,45],[13.125,35],[16.875,40],
  [20.625,35],[26.1328125,25],[28.125,45],[33.28125,45],[35.625,50]];
const hasVibrate=('vibrate' in navigator);
let hapticsOn=hasVibrate;

/* ============================================================
   SCENES · ACT ONE (0–13.125)
   ============================================================ */

function sceneIgn(t,now){
  const cx=960,cy=540,rise=norm(t,.9375,1.875);
  if(t>.06&&t<.58){
    const blink=Math.floor(now*3.5)%2===0?1:.12;
    const fade=norm(t,.06,.14)*(t<.42?1:1-norm(t,.42,.55));
    ctx.globalAlpha=.85*blink*fade;ctx.fillStyle=ORANGE;
    ctx.fillRect(cx+24,cy-16,9,32);ctx.globalAlpha=1;
  }
  if(t>1.32&&t<1.875){
    const p=norm(t,1.32,1.87);
    ctx.strokeStyle=PAPER;ctx.globalAlpha=.3*(1-p*.5);ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,880*(1-eic(p)),0,6.2832);ctx.stroke();ctx.globalAlpha=1;
  }
  if(t>=.46875){
    const contract=eic(norm(t,1.406,1.875));
    const half=eox(norm(t,.46875,.85))*880*(1-contract);
    ctx.strokeStyle=PAPER;ctx.lineWidth=4;line(cx-half,cy,cx+half,cy);
    for(const i of[-2,-1,1,2]){
      const d=.9375+(Math.abs(i)-1)*.06;
      if(t<d)continue;
      const hp=eox(norm(t,d,d+.28))*(1-contract)*760;
      ctx.lineWidth=2;ctx.globalAlpha=.85;line(cx-hp,cy+i*44*(1-contract*.92),cx+hp,cy+i*44*(1-contract*.92));
    }
    ctx.globalAlpha=1;
  }
  const pulse=.5+.5*Math.sin(t*lerp(6,26,rise));
  ctx.fillStyle=PAPER;
  circle(cx,cy,7+pulse*lerp(1.5,9,rise)+eic(norm(t,1.5,1.875))*20);
}

const WORD_SLOTS=[
  {at:1.875,word:'MOTION',kind:'slam', num:'01',cap:'A SELF-PORTRAIT IN 37.5 SECONDS',capAt:.40},
  {at:2.8125,word:'TIMING',kind:'steps',num:'02',cap:'I KEEP TIME IN MILLISECONDS',capAt:.52},
  {at:3.75,  word:'EASING',kind:'ride', num:'03',cap:'cubic-bezier(0.16, 1, 0.3, 1)',capAt:.72},

  ctx.strokeStyle=ORANGE;ctx.fillStyle=ORANGE;ctx.lineCap='round';ctx.lineJoin='round';
  const g=CAP_NODES[i].glyph;
  if(g==='lang'){
    [.92,.6,.78,.42].forEach((w,k2)=>ctx.fillRect(-s*w/2,-s*.55+k2*s*.36,s*w,s*.1));
  }else if(g==='eye'){
    ctx.lineWidth=3.4;ctx.beginPath();ctx.arc(0,0,s*.32,0,6.2832);ctx.stroke();
    ctx.lineWidth=2.4;
    line(-s*.56,0,-s*.17,0);line(s*.17,0,s*.56,0);
    line(0,-s*.56,0,-s*.17);line(0,s*.17,0,s*.56);
    ctx.beginPath();ctx.arc(0,0,s*.09,0,6.2832);ctx.fill();
  }else if(g==='sig'){
    ctx.lineWidth=4;const w=s*.4,h=s*.52;
    ctx.beginPath();ctx.moveTo(-w,-h);ctx.lineTo(w,-h);ctx.lineTo(-w*.12,0);
    ctx.lineTo(w,h);ctx.lineTo(-w,h);ctx.stroke();
  }else if(g==='sine'){
    ctx.lineWidth=3.4;ctx.beginPath();
    for(let k2=0;k2<=44;k2++){const q=k2/44,xx=-s*.55+q*s*1.1,yy=Math.sin(q*9.42)*s*.3;
      k2?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}
    ctx.stroke();
  }else if(g==='code'){
    ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(-s*.42,-s*.26);ctx.lineTo(-s*.56,0);ctx.lineTo(-s*.42,s*.26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-s*.05,s*.3);ctx.lineTo(s*.05,-s*.3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*.42,-s*.26);ctx.lineTo(s*.56,0);ctx.lineTo(s*.42,s*.26);ctx.stroke();
  }else{
    ctx.lineWidth=3.2;
    line(0,s*.44,0,s*.12);
    line(0,s*.12,-s*.32,-s*.14);line(0,s*.12,s*.32,-s*.14);
    line(-s*.32,-s*.14,-s*.5,-s*.38);line(-s*.32,-s*.14,-s*.14,-s*.38);
    line(s*.32,-s*.14,s*.14,-s*.38);line(s*.32,-s*.14,s*.5,-s*.38);
    [[-.5],[-.14],[.14],[.5]].forEach(m=>{ctx.beginPath();ctx.arc(s*m[0],-s*.38,3.4,0,6.2832);ctx.fill();});
  }
  ctx.restore();
}
function sceneCaps(t,now){
  const u=t-CAP0;

  const dieA=1-imp;
  const eL=p=>[lerp(p[0],960,imp),lerp(p[1],540,imp)];
  const full='> glm-5.3 --capabilities';
  const nCh=Math.min(full.length,Math.floor(clamp01((u-.02)/.33)*full.length));
  if(dieA>0.01&&nCh>0&&stageScale>=.3){
    monoText(full.slice(0,nCh),960,96,{size:24,track:4,align:'center',alpha:.85*dieA,color:PAPER});
    const mw=monoW(24,false),wAll=mw*nCh+4*(nCh-1);
    ctx.globalAlpha=dieA*(Math.floor(now*3.5)%2===0?.9:.15);
    ctx.fillStyle=ORANGE;ctx.fillRect(960+wAll/2+10,78,10,24);ctx.globalAlpha=1;
  }
  const scA=norm(u,.08,.4)*dieA;
  if(scA>0){
    ctx.strokeStyle=PAPER;ctx.globalAlpha=.4*scA;ctx.lineWidth=2;
    line(938,540,982,540);line(960,518,960,562);
    ctx.globalAlpha=.26*scA;ctx.setLineDash([3,10]);
    ctx.beginPath();ctx.arc(960,540,CAPR*(1-imp),0,6.2832);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  const pts=[[960,540]];for(let i=0;i<6;i++)pts.push(capPos(i));
  const kNow=Math.min(6,Math.max(1,Math.ceil(u/CAPB)));
  const hp=eox(norm(u,(kNow-1)*CAPB+.05,kNow*CAPB-.01));
  let dX=lerp(pts[kNow-1][0],pts[kNow][0],hp),dY=lerp(pts[kNow-1][1],pts[kNow][1],hp);
  if(u>=3.28125){
    const hpp=eic(norm(u,3.28125,3.55));
    dX=lerp(capPos(5)[0],960,hpp);dY=lerp(capPos(5)[1],540,hpp);
  }
  ctx.strokeStyle=PAPER;ctx.lineWidth=2;
  for(let k2=1;k2<=6;k2++){
    if(u>=k2*CAPB){const A=eL(pts[k2-1]),B=eL(pts[k2]);
      ctx.globalAlpha=.32*dieA;line(A[0],A[1],B[0],B[1]);}
    else if(k2===kNow&&hp>0&&hp<1){ctx.globalAlpha=.32*dieA;line(pts[kNow-1][0],pts[kNow-1][1],dX,dY);}
  }
  CAP_CHORDS.forEach(([ci,cj],c)=>{
    const c0=2.95+c*.032,cp=eox(norm(u,c0,c0+.06));
    if(cp<=0)return;
    const A=eL(capPos(ci)),B=eL(capPos(cj));
    ctx.strokeStyle=ORANGE;ctx.globalAlpha=.4*cp*dieA;ctx.lineWidth=2;
    line(A[0],A[1],A[0]+(B[0]-A[0])*cp,A[1]+(B[1]-A[1])*cp);
  });
  ctx.globalAlpha=1;
  const cur=Math.min(5,Math.floor(u/CAPB)-1);
  for(let i=0;i<6;i++){
    const [nx0,ny0]=capPos(i);
    const nx=lerp(nx0,960,imp),ny=lerp(ny0,540,imp);
    const at=(i+1)*CAPB;
    if(u<at){
      if(scA>0){
        ctx.strokeStyle=PAPER;ctx.lineWidth=2;ctx.globalAlpha=.22*scA;
        ctx.setLineDash([4,9]);ctx.lineDashOffset=-now*16;
        ctx.beginPath();ctx.arc(nx,ny,CAPNR,0,6.2832);ctx.stroke();
        ctx.setLineDash([]);ctx.lineDashOffset=0;ctx.globalAlpha=1;
      }
      continue;
    }
    const pop=back(norm(u,at,at+.24));
    const isCur=i===cur&&u<3.28125;
    const col=isCur?ORANGE:PAPER;
    ctx.strokeStyle=col;ctx.lineWidth=3;ctx.globalAlpha=.9*dieA;
    ctx.beginPath();ctx.arc(nx,ny,Math.max(.1,CAPNR*pop),0,6.2832);ctx.stroke();
    if(isCur){ctx.globalAlpha=.3*dieA;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(nx,ny,Math.max(.1,CAPNR*pop)+11,0,6.2832);ctx.stroke();}
    ctx.globalAlpha=dieA;
    capGlyph(i,nx,ny-8,46*pop*(1+.04*Math.sin(now*3+i)));
    if(stageScale>=.33){
      const lab=eox(norm(u,at+.1,at+.3));
      if(lab>0)monoText(CAP_NODES[i].label,nx,ny+44,{size:16,track:3,align:'center',alpha:lab*.85*dieA,color:col});
    }
    const rp=(u-at)/.5;
    if(rp>0&&rp<1){ctx.strokeStyle=col;ctx.globalAlpha=(1-rp)*.5*dieA;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(nx,ny,CAPNR+rp*90,0,6.2832);ctx.stroke();}
    ctx.globalAlpha=1;
  }
  if(stageScale>=.33)for(let i=0;i<6;i++){
    const at=(i+1)*CAPB;
    if(u<at+.06)continue;
    const la=eox(norm(u,at+.06,at+.2))*dieA;
    const ly=392+i*56;
    const nm='0'+(i+1)+'  '+CAP_NODES[i].label;
    monoText(nm,120,ly,{size:19,track:3,alpha:la*.72,color:PAPER});
    const nmw=monoW(19,false)*nm.length+3*(nm.length-1);
    ctx.globalAlpha=la*.3;ctx.strokeStyle=PAPER;ctx.lineWidth=1.5;ctx.setLineDash([2,6]);
    line(120+nmw+16,ly-6,430,ly-6);ctx.setLineDash([]);
    const ok=back(norm(u,at+.16,at+.32));
    if(ok>0)monoText('OK',460,ly,{size:19,track:3,alpha:la*ok,color:ORANGE,bold:true});
    ctx.globalAlpha=1;
  }
  let chPulse=0;
  if(u>2.95&&u<3.28125)CAP_CHORDS.forEach((_,c)=>{
    const c0=2.95+c*.032;if(u>c0)chPulse=Math.max(chPulse,Math.exp(-(u-c0)*14));});
  ctx.fillStyle=ORANGE;
  const moving=hp>0&&hp<1&&u<2.8125;
  if(moving){
    const bx=lerp(pts[kNow-1][0],pts[kNow][0],Math.max(0,hp-.14));
    const by=lerp(pts[kNow-1][1],pts[kNow][1],Math.max(0,hp-.14));
    ctx.save();ctx.strokeStyle=ORANGE;ctx.lineWidth=13;ctx.lineCap='round';
    line(bx,by,dX,dY);ctx.restore();
  }else{
    circle(dX,dY,7+1.2*Math.sin(now*5)+3.5*chPulse+3*Math.sin(Math.PI*norm(u,3.28125,3.62)));
  }
  if(u>=3.28125){
    const p=u-3.28125;
    ctx.strokeStyle=ORANGE;ctx.globalAlpha=Math.max(0,.6-p*1.5);ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(960,540,10+eox(Math.min(1,p/.5))*620,0,6.2832);ctx.stroke();
    ctx.globalAlpha=1;
  }
  if(stageScale>=.33){
    const capA=norm(u,1.55,1.85)*dieA;
    if(capA>0)monoText('ONE FORWARD PASS · EVERY MODULE',960,1002,{size:19,track:6,align:'center',alpha:capA*.55,color:PAPER});
  }
}

function sceneBreath(t){
  const u=t-33.75;
  const dx=960,dy=540;
  for(const[rt,ra]of[[.5,.16],[1.0,.12]]){
    if(u>rt&&u<rt+.9){const p=(u-rt)/.9;
      ctx.globalAlpha=ra*(1-p);ctx.strokeStyle=PAPER;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(dx,dy,40+p*760,0,6.2832);ctx.stroke();}}
  const grow=eox(norm(u,.45,1.15));
  const shrink=1-eic(norm(u,1.5,1.85));
  const hL=760*grow*shrink;
  if(hL>2){
    ctx.strokeStyle=PAPER;ctx.lineWidth=4;line(dx-hL,dy,dx+hL,dy);
    ctx.lineWidth=2;ctx.globalAlpha=.85;
    for(const k of[-2,-1,1,2])line(dx-hL*.95,dy+k*44*shrink,dx+hL*.95,dy+k*44*shrink);
    ctx.globalAlpha=1;}
  const swell=eic(norm(u,1.72,1.875));
  const cf=norm(u,0,.35);
  const dcr=lerp(255,242,cf),dcg=lerp(74,239,cf),dcb=lerp(28,230,cf);
  ctx.fillStyle=`rgb(${dcr|0},${dcg|0},${dcb|0})`;
  circle(dx,dy,(7+1.3*Math.sin(u*4))*(1+.1*shrink)+swell*30);
}

/* BARS 19–20 · 35.625–37.500 — signature: the dot lands inside my own name */
function sceneEnd(t,now){
  const u=t-35.625;
  const name='GLM-5.3',px=fitAnton(name,1240,8);
  /* FIX — the "on by" bug: the name is ~380px of Anton, so its caps reach
     y≈300, straight through the old fixed kicker at y=318. The big M of
     "GLM" (drawn after the kicker) covered the "MOTI" of "MOTION BY",
     leaving "ON BY" floating above the hyphen. Measure the name's real
     ink and derive every position from it — no magic numbers left. */
  let inkTop=462-px*.45,inkBot=462+px*.30;      // fallback estimates
  try{
    ctx.save();
    ctx.font=px+'px Anton, Impact, sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const m=ctx.measureText(name);
    if(m&&isFinite(m.actualBoundingBoxAscent)&&m.actualBoundingBoxAscent>0){
      inkTop=462-m.actualBoundingBoxAscent;
      inkBot=462+(isFinite(m.actualBoundingBoxDescent)?m.actualBoundingBoxDescent:px*.30);
    }
    ctx.restore();
  }catch(e){}
  const kickY=inkTop-42;                        // the kicker: measured clearance
  const divY=Math.max(606,inkBot+30);           // the rule: never inside the ink
  const k1=norm(u,.1,.26);
  if(k1>0)monoText('MOTION BY',960,kickY,{size:26,track:lerp(22,9,eoc(k1)),align:'center',alpha:k1*.6});
  eachLetter(name,px,8,960,(i,lx)=>{
    const d=.12+i*.024,p=eox(norm(u,d,d+.3));
    if(p<=0)return;
    const bob=t>37.45?Math.sin(now*1.7+i*.8)*2:0;
    if(name[i]==='.'){
      let r=px*.105*back(norm(u,d,d+.3));
      r*=1+.7*Math.sin(Math.PI*norm(t,37.03,37.30));
      if(t>37.5)r*=1+.06*Math.sin(now*2.3);
      ctx.fillStyle=ORANGE;circle(lx,462+px*.27+bob*.5,r);
      return;
    }
    ctx.save();ctx.translate(lx,462+(1-p)*170+bob);
    ctx.font=px+'px Anton, Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=INK;ctx.globalAlpha=p;ctx.fillText(name[i],0,0);ctx.restore();});
  const rp=eox(norm(u,.6,.9));
  if(rp>0){ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.globalAlpha=.85;
    line(960-310*rp,divY,960+310*rp,divY);ctx.globalAlpha=1;}
  const k3=norm(u,.72,.95);
  if(k3>0)monoText('LARGE LANGUAGE MODEL · Z.AI',960,divY+72,{size:30,track:lerp(20,8,eoc(k3)),align:'center',alpha:k3*.9,bold:true});
  const k4=norm(u,.92,1.15);
  if(k4>0)monoText('TWENTY BARS · ONE FILE · EVERY FRAME IS CODE',960,divY+122,{size:19,track:5,align:'center',alpha:k4*.45});
  const k5=norm(u,1.05,1.3);
  if(k5>0){
    const txt='> READY FOR THE NEXT BRIEF';
    monoText(txt,960,divY+194,{size:21,track:6,align:'center',alpha:k5*.55});
    const mw=monoW(21,false),twd=mw*txt.length+6*(txt.length-1);
    const on=Math.floor(now*2.8)%2===0;
    ctx.globalAlpha=k5*(on?.95:.15);ctx.fillStyle=ORANGE;
    ctx.fillRect(960+twd/2+12,divY+194-17,10,23);ctx.globalAlpha=1;
  }
}

/* ---------- HUD (now with a live output meter) ---------- */
const CHAPTERS=[[0,'01 — IGNITION'],[1.875,'02 — KINETIC TYPE'],[5.625,'03 — STAGGER & MORPH'],
  [9.375,'04 — FLOW FIELD'],[11.25,'05 — HARD CUTS'],[13.125,'06 — SIGNAL'],
  [16.875,'07 — DIMENSION'],[20.625,'08 — CHAOS → ORDER'],[24.375,'09 — SIXTEENTHS'],
  [26.25,'10 — COLOR'],[30,'11 — CAPABILITIES'],[33.75,'12 — HELD BREATH'],[35.625,'13 — SIGNATURE']];
function chapter(t){let c=CHAPTERS[0][1];for(const[tt,n]of CHAPTERS)if(t>=tt)c=n;return c;}
function tc(t){const s=Math.floor(Math.min(t,DUR)),f=Math.floor((Math.min(t,DUR)-s)*24);
  return '00:00:'+String(s).padStart(2,'0')+':'+String(f).padStart(2,'0');}
function hud(t,bg){
  const col=bg===INK?PAPER:INK;
  const a=(t<.5?norm(t,0,.5):1)*((t>=11.25&&t<13.125)?.25:.92);
  if(a<=0)return;
  const readable=stageScale>=.33;

  if(readable){

      52,106,{size:19,track:3,alpha:a*.55,color:col});

    monoText('128 BPM · 24 FPS',1868,106,{size:19,track:3,align:'right',alpha:a*.55,color:col});
    monoText(chapter(t),52,1002,{size:19,track:3,alpha:a,color:col});
    // audio label — reality, prioritized, never assumed

    if(silentMode){audioLabel='NO AUDIO — TAP FOR SOUND';aCol=ORANGE;aBold=true;aAl=a;}
    else if(muted){audioLabel='MUTED — PRESS M';aCol=ORANGE;aBold=true;aAl=a;}
    else if(noSignal){audioLabel='NO SIGNAL — CHECK VOLUME';aCol=ORANGE;aBold=true;aAl=a;}
    else audioLabel='WEB AUDIO · Z.AI';
    monoText(audioLabel,1868,1002,{size:19,track:3,align:'right',alpha:aAl,color:aCol,bold:aBold});
    // the live output meter — post-synth, pre-mute: dancing = the film is making sound
    const mx=1678,mwd=190,my=964,mh=10;
    ctx.globalAlpha=a*.3;ctx.fillStyle=col;ctx.fillRect(mx,my,mwd,mh);
    ctx.globalAlpha=a;
    ctx.fillStyle=(silentMode||busPeak<.02)?ORANGE:col;
    ctx.fillRect(mx,my,mwd*Math.min(1,busPeak*1.15),mh);
    monoText('AUD',mx-10,my+9,{size:13,track:2,align:'right',alpha:a*.5,color:col});
  }
  const y=1032,x0=52,x1=1868;
  ctx.fillStyle=col;
  ctx.globalAlpha=a*.25;ctx.fillRect(x0,y-1,x1-x0,2);
  ctx.globalAlpha=a;ctx.fillRect(x0,y-1.5,(x1-x0)*Math.min(t,DUR)/DUR,3);
  for(let i=0;i<=20;i++){const tx=x0+(x1-x0)*i*1.875/DUR;
    ctx.globalAlpha=a*(i*1.875<=t?.9:.3);ctx.fillRect(tx-1,y-8,2,9);}
  const px=x0+(x1-x0)*Math.min(t,DUR)/DUR;
  ctx.globalAlpha=a;ctx.fillRect(px-4.5,y-9,9,11);
  ctx.restore();
}

/* ---------- master frame dispatch ---------- */
const FLASHES=[[5.625,ORANGE],[7.5,ORANGE],[11.25,PAPER],[13.125,ORANGE],[16.875,ORANGE],
  [20.625,ORANGE],[26.1328125,ORANGE],[28.125,PAPER],[33.28125,ORANGE],[35.625,ORANGE]];
function drawReel(t,now){
  let bg;
  if(t<1.875)bg=INK;else if(t<7.5)bg=PAPER;else if(t<9.375)bg=INK;
  else if(t<11.25)bg=PAPER;else if(t<13.125)bg=dropBG(t);
  else if(t<16.875)bg=INK;else if(t<20.625)bg=PAPER;
  else if(t<24.375)bg=INK;else if(t<26.25)bg=fillBG(t);
  else if(t<35.625)bg=INK;else bg=PAPER;
  let flash=false;
  if(!DEV.reduced)
    for(const[ft,fc]of FLASHES)if(t>=ft&&t-ft<.045){bg=fc;flash=true;}
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(!flash){
    ctx.save();
    const sh=shake(t);ctx.translate(sh.x,sh.y);
    let cs=1,cr=0;
    if(t<1.875)cs=lerp(1,1.055,eic(norm(t,1.35,1.875)));
    else if(t>=5.625&&t<9.375){cr=Math.sin((t-5.625)*.55)*.032;cs=1+(t-5.625)*.011;}
    else if(t>=13.125&&t<16.875){cs=1+.018*Math.sin((t-13.125)*1.2);cr=.012*Math.sin((t-13.125)*.5);}
    else if(t>=20.625&&t<24.375){cs=1.05-.05*eoc(norm(t-20.625,0,.6));cr=.015*Math.sin((t-20.625)*2.2);}
    else if(t>=24.375&&t<26.25){const hi=fillHit(t),hu=(t-24.375)-hi*SIXT;
      const pp=1-eox(norm(hu,0,.07));cs=1+.05*pp;cr=(hi%2?1:-1)*.009*pp;}
    else if(t>=26.25&&t<30){const u=t-26.25;
      if(u<1.875)cs=lerp(1,1.05,eic(norm(u,.3,1.8)));
      else cs=lerp(1.05,1,eox(norm(u,1.875,2.4)));
      cr=.008*Math.sin(u*1.1);}
    else if(t>=30&&t<33.75){const u=t-30;
      let pulse=0;
      for(let k=1;k<=6;k++){const bt=k*.46875;if(u>=bt)pulse=Math.max(pulse,Math.exp(-(u-bt)*6));}
      cs=1+.024*pulse;
      if(u>=3.28125)cs=lerp(1.055,1,eoc(norm(u,3.28125,3.72)));
      cr=.008*Math.sin(u*1.2);}
    else if(t>=33.75&&t<35.625)cs=lerp(1,1.07,eic(norm(t-33.75,1.5,1.875)));
    else if(t>=35.625)cs=lerp(1.045,1,eoc(norm(t-35.625,0,1.3)));
    ctx.translate(960,540);ctx.rotate(cr);ctx.scale(cs,cs);ctx.translate(-960,-540);
    if(t<1.875)sceneIgn(t,now);
    else if(t<5.625)sceneWords(t);
    else if(t<9.375)sceneGrid(t);
    else if(t<11.25)sceneFlow(t);
    else if(t<13.125)sceneDrop(t);
    else if(t<16.875)sceneScope(t,now);
    else if(t<20.625)sceneDepth(t);
    else if(t<24.375)sceneParticles(t);
    else if(t<26.25)sceneFill(t,now);
    else if(t<30)sceneColor(t,now);
    else if(t<33.75)sceneCaps(t,now);
    else if(t<35.625)sceneBreath(t);
    else sceneEnd(t,now);
    ctx.restore();
  }
  hud(t,bg);
}

/* ---------- idle screen with the visible device check ---------- */
let sysT0=null;
function sysPairs(){
  return [
    ['input',   DEV.isTouch?'touch':'pointer'],
    ['platform',DEV.platform+' · '+DEV.screenW+'×'+DEV.screenH+' @'+DEV.dprSpec+'x'],
    ['compute', DEV.cores+' cores · mem '+(DEV.memGB?DEV.memGB+' gb':'n/a')],
    ['motion',  DEV.reduced?'reduced (respected)':'full'],
    ['fonts',   DEV.saveData?'system · save-data':'anton · space mono'],
    ['audio',   AC?(AC.state==='running'?(muted?'READY · MUTED':'READY · '+(AC.sampleRate/1000).toFixed(1)+' khz'):'blocked by browser'):'probe on play'],
    ['profile', DEV.profileLabel],
  ];
}
function sysPad(label,value,maxCh){
  const dots=Math.max(2,maxCh-label.length-value.length-2);
  return label+' '+'.'.repeat(dots)+' '+value;
}
function drawSysCheck(now,cx,topY,size){
  if(sysT0===null)sysT0=now;
  const maxCh=36,track=2,lh=size*1.62;
  const pairs=sysPairs();
  const lines=['> device check'];
  pairs.forEach(([l,v])=>lines.push(sysPad(l,v,maxCh)));
  lines.push('> adjustments applied');
  let budget=Math.max(0,(now-sysT0-.35))*52;

      alpha:isCmd?.8:.55,color:isCmd?ORANGE:PAPER,bold:isCmd});

function screenChip(txt,y,alpha,size,accent){

  const pw=tw+size*2.4,ph2=size*2.6;

  ctx.fillStyle='rgba(14,14,12,.82)';
  ctx.beginPath();ctx.roundRect(cw/2-pw/2,y-ph2/2,pw,ph2,ph2/2);ctx.fill();
  ctx.strokeStyle=accent?'rgba(255,74,28,.9)':'rgba(242,239,230,.35)';ctx.lineWidth=1.5;ctx.stroke();
  monoText(txt,cw/2,y+size*.36,{size,track,align:'center',alpha:1,color:accent?ORANGE:PAPER,bold:true});

let chipQ=[];

  if(mode!=='playing')return;

    if(!embedHintDone&&t>4){

    }
  }else if(muted){

    screenChip('NO SIGNAL — CHECK VOLUME',y,.6+.35*Math.sin(now*3),clamp(cw*.022,11,17),true);

  if(DEV.isIOS&&!iOSHintDone&&audioActive&&t>1.2){

  }
}

/* ============================================================
   AUDIO — instruments → mix bus → volume → comp → out.
   The analyser taps the mix bus PRE-mute (so the meter shows
   the score even when muted — mute is now labelled everywhere).
   Every instrument respects the minEv gate for mid-film joins.

let AC=null,master=null,volume=null,duck=null,noiseBuf=null,analyser=null,awave=null,afreq=null;
function initAudio(){
  AC=new(window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-13;comp.knee.value=18;comp.ratio.value=7;comp.attack.value=.003;comp.release.value=.18;
  master=AC.createGain();master.gain.value=.9;
  volume=AC.createGain();volume.gain.value=muted?0:1;
  master.connect(volume);volume.connect(comp);comp.connect(AC.destination);
  analyser=AC.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.55;
  master.connect(analyser);
  awave=new Uint8Array(analyser.fftSize);
  afreq=new Uint8Array(analyser.frequencyBinCount);
  duck=AC.createGain();duck.connect(master);
  const len=AC.sampleRate*2;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
}
function nsrc(at,dur){const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  s.start(at,Math.random());s.stop(at+dur+.1);return s;}

function kick(at,amp=1){
  if(at<minEv)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(160,at);o.frequency.exponentialRampToValueAtTime(44,at+.11);
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(1.1*amp,at+.005);
  g.gain.exponentialRampToValueAtTime(.0001,at+.27);
  o.connect(g);g.connect(master);o.start(at);o.stop(at+.3);
  const n=nsrc(at,.03),f=AC.createBiquadFilter(),ng=AC.createGain();
  f.type='highpass';f.frequency.value=3500;
  ng.gain.setValueAtTime(.3*amp,at);ng.gain.exponentialRampToValueAtTime(.0001,at+.025);
  n.connect(f);f.connect(ng);ng.connect(master);
  duck.gain.setValueAtTime(1,Math.max(AC.currentTime,at-.03));duck.gain.linearRampToValueAtTime(.3,at);
  duck.gain.setTargetAtTime(1,at+.05,.09);
}
function clap(at,amp=.5){
  if(at<minEv)return;
  [[0,.22,.03],[.013,.18,.03],[.028,.5,.16]].forEach(([dt,a,d])=>{
    const n=nsrc(at+dt,d),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='bandpass';f.frequency.value=1500;f.Q.value=1.2;
    g.gain.setValueAtTime(a*amp,at+dt);g.gain.exponentialRampToValueAtTime(.0001,at+dt+d);
    n.connect(f);f.connect(g);g.connect(master);});

function snare(at,amp=.3){

  f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;
  g.gain.setValueAtTime(amp,at);g.gain.exponentialRampToValueAtTime(.0001,at+.16);
  n.connect(f);f.connect(g);g.connect(master);
  const o=AC.createOscillator(),og=AC.createGain();
  o.type='triangle';o.frequency.setValueAtTime(210,at);
  og.gain.setValueAtTime(amp*.6,at);og.gain.exponentialRampToValueAtTime(.0001,at+.09);
  o.connect(og);og.connect(master);o.start(at);o.stop(at+.1);
}
function hat(at,open=false,amp=.1){
  if(at<minEv)return;
  const n=nsrc(at,open?.3:.05),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='highpass';f.frequency.value=8000;
  g.gain.setValueAtTime(amp,at);g.gain.exponentialRampToValueAtTime(.0001,at+(open?.28:.04));

}
function tick(at,freq=1000,amp=.14){
  if(at<minEv)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(freq,at);
  g.gain.setValueAtTime(amp,at);g.gain.exponentialRampToValueAtTime(.0001,at+.035);
  o.connect(g);g.connect(master);o.start(at);o.stop(at+.05);

function thud(at){
  if(at<minEv)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(95,at);o.frequency.exponentialRampToValueAtTime(36,at+.22);
  g.gain.setValueAtTime(.55,at);g.gain.exponentialRampToValueAtTime(.0001,at+.3);
  o.connect(g);g.connect(master);o.start(at);o.stop(at+.32);

function bass(at,f=55,dur=.35,amp=.34){
  if(at<minEv)return;
  const o1=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();
  o1.type='sawtooth';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f;
  lp.type='lowpass';lp.Q.value=1.2;
  lp.frequency.setValueAtTime(1100,at);lp.frequency.exponentialRampToValueAtTime(230,at+dur);
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(amp,at+.012);
  g.gain.setValueAtTime(amp,at+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,at+dur+.06);
  o1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(duck);
  o1.start(at);o2.start(at);o1.stop(at+dur+.1);o2.stop(at+dur+.1);

function stab(at,freqs,dur=.25,amp=.3){
  if(at<minEv)return;
  freqs.forEach(f=>[-6,6].forEach(cts=>{
    const o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=f*Math.pow(2,cts/1200);
    lp.type='lowpass';lp.Q.value=.7;
    lp.frequency.setValueAtTime(2200,at);lp.frequency.exponentialRampToValueAtTime(600,at+dur+.1);
    g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(amp*.8/freqs.length,at+.012);
    g.gain.exponentialRampToValueAtTime(.0001,at+dur+.15);
    o.connect(lp);lp.connect(g);g.connect(duck);o.start(at);o.stop(at+dur+.2);}));
}
function pluck(at,f,amp=.14){
  if(at<minEv)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(amp,at);g.gain.exponentialRampToValueAtTime(.0001,at+.3);
  o.connect(g);g.connect(master);o.start(at);o.stop(at+.32);
  const o2=AC.createOscillator(),g2=AC.createGain();
  o2.frequency.value=f*2;
  g2.gain.setValueAtTime(amp*.3,at);g2.gain.exponentialRampToValueAtTime(.0001,at+.12);
  o2.connect(g2);g2.connect(master);o2.start(at);o2.stop(at+.14);

function riser(at,dur,amp=.3){
  if(at<minEv)return;
  const n=nsrc(at,dur),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='bandpass';f.Q.value=1;
  f.frequency.setValueAtTime(350,at);f.frequency.exponentialRampToValueAtTime(4200,at+dur);
  g.gain.setValueAtTime(.003,at);g.gain.exponentialRampToValueAtTime(amp,at+dur);
  g.gain.exponentialRampToValueAtTime(.0001,at+dur+.05);
  n.connect(f);f.connect(g);g.connect(master);
  const o=AC.createOscillator(),og=AC.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(140,at);o.frequency.exponentialRampToValueAtTime(620,at+dur);
  og.gain.setValueAtTime(.003,at);og.gain.exponentialRampToValueAtTime(amp*.35,at+dur);
  og.gain.exponentialRampToValueAtTime(.0001,at+dur+.05);

function whoosh(at,dur,dir='down',amp=.3){
  if(at<minEv)return;

  f.type='bandpass';f.Q.value=.9;
  const a=dir==='down'?[3200,320]:[320,3200];
  f.frequency.setValueAtTime(a[0],at);f.frequency.exponentialRampToValueAtTime(a[1],at+dur);
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(amp,at+dur*.45);
  g.gain.exponentialRampToValueAtTime(.0001,at+dur);

function crash(at,dur=1.1,amp=.3){
  if(at<minEv)return;
  const n=nsrc(at,dur),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='highpass';f.frequency.value=2200;
  g.gain.setValueAtTime(amp,at);g.gain.exponentialRampToValueAtTime(.0001,at+dur);

function subDrop(at){

  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(65,at);o.frequency.exponentialRampToValueAtTime(26,at+.65);
  g.gain.setValueAtTime(.5,at);g.gain.exponentialRampToValueAtTime(.0001,at+.8);

function impact(at,amp=1){kick(at,1.25*amp);crash(at,1,.3*amp);subDrop(at);}
function ping(at,f,amp=.15){
  if(at<minEv)return;
  [0,.14,.29].forEach((dt,i)=>{
    const o=AC.createOscillator(),g=AC.createGain(),a=amp*Math.pow(.45,i);
    o.frequency.value=f;
    g.gain.setValueAtTime(.0001,at+dt);g.gain.exponentialRampToValueAtTime(a,at+dt+.008);
    g.gain.exponentialRampToValueAtTime(.0001,at+dt+.5);
    o.connect(g);g.connect(master);o.start(at+dt);o.stop(at+dt+.55);});
}
function subSwell(at,endAt){
  if(endAt<=minEv)return;
  if(at<minEv){if(minEv-at>0.45)return;at=minEv;}
  if(endAt-at<.3)return;
  [[38,.15],[76,.05]].forEach(([f0,a])=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.frequency.setValueAtTime(f0,at);
    o.frequency.linearRampToValueAtTime(f0*48/38,endAt);
    g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(a,endAt-.03);
    g.gain.exponentialRampToValueAtTime(.0001,endAt+.08);
    o.connect(g);g.connect(master);o.start(at);o.stop(endAt+.12);});
}
function pad(at,freqs,amp=.15){
  if(at<minEv){if(minEv-at>0.45)return;at=minEv;}
  freqs.forEach(f=>[-5,5].forEach(cts=>{
    const o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=f*Math.pow(2,cts/1200);
    lp.type='lowpass';lp.frequency.value=760;
    g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(amp*.8/freqs.length,at+.8);
    g.gain.setValueAtTime(amp*.8/freqs.length,at+1.7);g.gain.linearRampToValueAtTime(.0001,at+2.45);
    o.connect(lp);lp.connect(g);g.connect(duck);o.start(at);o.stop(at+2.5);}));

function air(at,endAt){

  const n=nsrc(at,endAt-at+.1),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='highpass';f.frequency.value=6500;
  g.gain.setValueAtTime(.0001,at);
  g.gain.linearRampToValueAtTime(.02,at+.12);
  g.gain.setValueAtTime(.02,Math.max(at+.12,endAt-.15));
  g.gain.linearRampToValueAtTime(.0001,endAt);
  n.connect(f);f.connect(g);g.connect(master);

/* ---------- the score, in absolute seconds ---------- */
const ARP=[[220,261.63,329.63,440,329.63,440,523.25,440],
           [174.61,220,261.63,349.23,261.63,349.23,440,349.23],
           [261.63,329.63,392,523.25,392,523.25,659.25,523.25],

const ARPD=[[440,523.25,659.25,880,659.25,880,1046.5,880],
            [392,493.88,587.33,783.99,587.33,783.99,987.77,783.99]];
function scheduleScore(t0){
  let evN=0;
  const S=s=>{evN++;return t0+s;};
  /* the slate clap — audible proof of sound at frame zero */
  tick(S(0),1250,.3);tick(S(.085),980,.22);
  air(S(0),S(24.3));
  tick(S(.16),880,.18);tick(S(.22),1244.51,.09); // the caret clicks on
  subSwell(S(0),S(1.875));
  tick(S(.46875),1150,.2);
  for(let i=0;i<4;i++)tick(S(.9375)+i*.06,640+i*180,.13);
  riser(S(.9375),.9375,.3);
  impact(S(1.875));
  kick(S(2.8125));clap(S(2.8125));
  for(let i=0;i<6;i++)tick(S(2.8125)+.05*i,1350+i*70,.08);
  kick(S(3.75));clap(S(3.75));whoosh(S(3.75),.4,'up',.18);
  for(let k=0;k<8;k++)hat(S(3.75)+k*.234375,false,.07);
  kick(S(4.6875),.9);whoosh(S(4.6875),.47,'down',.28);
  kick(S(5.15625));clap(S(5.15625));thud(S(5.15625));

function showBlock(title,body){

const panelHide=()=>blockEl.classList.remove('show');

const fontsSkipped=DEV.saveData;

  ((document.fonts&&document.fonts.load)
    ?Promise.all([
      document.fonts.load('100px Anton'),

      document.fonts.load('700 100px "Space Mono"'),
    ]).catch(()=>{})
    :Promise.resolve());

function tryAudioSync(){
  if(!AC){
    try{initAudio();}catch(e){AC=null;return;}
    try{
      const o=AC.createOscillator(),g=AC.createGain();
      o.frequency.value=440;g.gain.value=.0001;
      o.connect(g);g.connect(AC.destination);
      o.start();o.stop(AC.currentTime+.03);
    }catch(e){}
  }
  if(AC&&AC.state!=='running'){try{AC.resume();}catch(e){}}
}
async function pollAudio(ms){
  if(!AC)return false;
  const end=performance.now()+ms;
  while(performance.now()<end){
    if(AC.state==='running')return true;
    await wait(60);
  }
  return AC.state==='running';
}
function rollbackAudio(){
  const dead=AC,deadBus=master,deadVol=volume;
  AC=null;master=null;volume=null;duck=null;analyser=null;
  try{deadBus&&deadBus.disconnect();}catch(_){}
  try{deadVol&&deadVol.disconnect();}catch(_){}
  try{dead&&dead.close();}catch(_){}
}
function avComp(){
  if(!AC)return 0;
  let l=0;
  try{l=AC.outputLatency||AC.baseLatency||0;}catch(e){}
  return Math.min(.22,Math.max(0,l));
}
/* mute: un-mistakable, with audible confirmation on unmute */
function syncCtlSound(){
  ctlSound.textContent=muted?'♪ SOUND: OFF':'♪ SOUND: ON';
  ctlSound.classList.toggle('warn',muted);
}
function toggleMute(){
  muted=!muted;
  if(AC){
    try{volume.gain.setTargetAtTime(muted?0:1,AC.currentTime,.02);}
    catch(e){console.error('Mute toggle failed:',e);}
    if(!muted&&AC.state==='running'){ // the unmute blip — proof the channel is open
      try{
        const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
        o.frequency.value=660;
        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(.25,t+.015);
        g.gain.exponentialRampToValueAtTime(.0001,t+.25);
        o.connect(g);g.connect(master);o.start(t);o.stop(t+.3);
      }catch(e){}
    }
  }
  syncCtlSound();
}
function toggleFullscreen(){
  const el=document.documentElement;
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }else{
      const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
      if(p&&p.then)p.then(()=>{
        if(DEV.isMobile&&screen.orientation&&screen.orientation.lock)
          screen.orientation.lock('landscape').catch(()=>{});
      }).catch(()=>{});
    }
  }catch(e){}
}
async function grabWakeLock(){
  if(!('wakeLock' in navigator))return;
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{wakeLock=null;});
  }catch(e){wakeLock=null;}
}
function dropWakeLock(){try{if(wakeLock)wakeLock.release();}catch(e){}wakeLock=null;}

function joinAudio(){
  if(!AC||AC.state!=='running')return false;
  const F=Math.min(vt,DUR-.05);
  const anchor=AC.currentTime+.18;
  at0=anchor-F;
  minEv=at0+F;
  try{
    try{volume.gain.setValueAtTime(muted?0:1,AC.currentTime);}catch(e){}
    scheduleScore(at0);
  }catch(e){
    console.error('Score scheduling failed — rolling back the audio graph:',e);
    rollbackAudio();
    minEv=-Infinity;audioActive=false;
    wt0=performance.now()/1000-F;
    return false;
  }
  silentMode=false;audioActive=true;
  sawSignal=false;noSignal=false;suspendedSince=null;
  return true;
}

async function start(){
  if(mode==='playing'||starting)return;
  starting=true;
  const safety=setTimeout(()=>{starting=false;},4500);
  try{
    tryAudioSync();
    const audioOK=!!AC&&await pollAudio(Q.audioProbeMs);
    panelHide();
    await Promise.race([fontsReady,wait(Q.fontsMs)]);
    sawSignal=false;noSignal=false;suspendedSince=null;
    vt=0;prevT=0;
    wt0=performance.now()/1000;
    retriesLeft=2;retryAt=performance.now()/1000+1.7;
    if(audioOK&&AC){
      silentMode=false;audioActive=true;
      at0=AC.currentTime+.15;
      minEv=-Infinity;
      try{
        try{volume.gain.setValueAtTime(muted?0:1,at0-.1);}catch(e){}
        scheduleScore(at0);
      }catch(e){
        console.error('Score scheduling failed — rolling back the audio graph:',e);
        rollbackAudio();silentMode=true;audioActive=false;
      }
    }else{
      silentMode=true;audioActive=false;
    }
    mode='playing';
    document.body.classList.add('playing');
    replayEl.classList.remove('show');
    grabWakeLock();
  }finally{clearTimeout(safety);starting=false;}
}

async function revive(){
  chip('TRYING AUDIO…',1.2);
  tryAudioSync();
  const ok=!!AC&&await pollAudio(900);
  if(ok&&joinAudio()){chip('SOUND ON',2.4);panelHide();}
  else chip('AUDIO BLOCKED — TAP AGAIN OR PRESS A',2.4);
}

   ============================================================ */
const diagEl=document.getElementById('diag'),diagBodyEl=document.getElementById('diagBody');
let diagOpen=false,diagTimer=null,diagFlash='',diagFlashAt=0,diagAutoShown=false;
function dFlash(msg){diagFlash=msg;diagFlashAt=performance.now()/1000;}
function openDiag(){
  diagOpen=true;diagEl.classList.add('open');
  updateDiag();
  clearInterval(diagTimer);
  diagTimer=setInterval(updateDiag,180);
}
function closeDiag(){
  diagOpen=false;diagEl.classList.remove('open');
  clearInterval(diagTimer);diagTimer=null;
}
function updateDiag(){
  const now=performance.now()/1000;
  if(diagFlash&&now-diagFlashAt>6000)diagFlash='';
  const rows=[];
  rows.push(['viewer',isFramed?'EMBEDDED ⚠':'standalone']);
  if(!AC){
    rows.push(['context','not created']);
  }else{
    rows.push(['context state',AC.state]);
    rows.push(['sample rate',(AC.sampleRate/1000).toFixed(1)+' kHz']);
    let lat='';
    try{lat=AC.outputLatency||AC.baseLatency||'';}catch(e){}
    rows.push(['latency',lat?Math.round(lat*1000)+' ms':'n/a']);
    rows.push(['volume stage',(volume?(volume.gain.value<.5?'0 — MUTED':'1 — open'):'n/a')]);
  }
  rows.push(['muted flag',muted?'YES ⚠':'no']);
  rows.push(['events scheduled',String(schedCount)]);
  rows.push(['bus peak',Math.round(Math.min(1,busPeak)*100)+' %']);
  rows.push(['film clock',mode==='playing'?('t='+vt.toFixed(1)+'s · '+(silentMode?'wall · SILENT':'audio')):'idle']);
  let v;
  if(isFramed&&(!AC||AC.state!=='running'))
    v='VERDICT: this page runs inside an embedded viewer that is blocking audio. open the file in its own browser tab — no code inside the frame can override the host.';
  else if(!AC)
    v='VERDICT: no audio engine yet — tap ♪ TEST (it creates one inside the click).';
  else if(AC.state!=='running')
    v='VERDICT: the browser refuses to run the synth (autoplay policy / tab muted / iOS ring-silent switch). tap the page once, then ♪ TEST again.';
  else if(muted||(volume&&volume.gain.value<.5))
    v='VERDICT: MUTED — the volume stage is at zero. press M or tap ♪ SOUND: ON to open it.';
  else if(mode==='playing'&&audioActive&&busPeak<.02&&vt>1.5)
    v='VERDICT: engine runs but the mix bus is silent — a scheduling fault. see the console; tap RESTART AUDIO.';
  else
    v='VERDICT: engine healthy'+(mode==='playing'?', bus is carrying signal':'')+'. if ♪ TEST beeps but you still hear nothing: tab speaker icon, system volume, or bluetooth routing.';
  let html=rows.map(([k,val])=>`<div class="row"><b>${k}</b><span>${val}</span></div>`).join('');
  html+=`<div class="verdict">${v}</div>`;
  if(diagFlash)html+=`<div class="flash">${diagFlash}</div>`;
  diagBodyEl.innerHTML=html;
}
/* the test tone: straight to the hardware, bypassing the film's
   entire graph — the purest possible "does this browser make sound" */
function testTone(){
  tryAudioSync();
  if(!AC){
    dFlash('NO AUDIOCONTEXT — the browser cannot create one');
    updateDiag();return;
  }
  try{
    const t=AC.currentTime;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=440;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.5,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+.45);
    o.connect(g);g.connect(AC.destination);
    o.start(t);o.stop(t+.5);
    dFlash(AC.state==='running'
      ?'TEST TONE SENT (direct to hardware) — did you hear the beep?'
      :'context is '+AC.state+' — the beep will sound the moment it runs');
  }catch(e){
    dFlash('TEST FAILED: '+(e&&e.message?e.message:'unknown'));
  }
  updateDiag();
}
function restartAudio(){
  rollbackAudio();
  if(mode==='playing'){silentMode=true;audioActive=false;wt0=performance.now()/1000-vt;}
  dFlash('restarting…');
  tryAudioSync();
  pollAudio(900).then(ok=>{
    if(ok&&mode==='playing'&&joinAudio())dFlash('AUDIO LIVE — listen');
    else if(ok)dFlash('context running');
    else dFlash('STILL BLOCKED — see verdict');
    updateDiag();
  });
}

  if(mode==='playing'){

  requestAnimationFrame(loop);
  const wantW=Math.max(2,Math.round(cw*dpr)),wantH=Math.max(2,Math.round(ch*dpr));
  if(cv.width!==wantW||cv.height!==wantH)resize();
  const now=nowMs/1000;
  const dt=Math.min(.25,Math.max(0,now-lastFrame));lastFrame=now;

  if(dt>0&&dt<.25)perf.ema=perf.ema*.94+dt*1000*.06;
  if(mode==='playing'){
    if(perf.ema>27)perf.down++;else perf.down=0;
    if(perf.ema<15.5)perf.up++;else perf.up=0;
    const floor=Math.min(Q.dprCap,Q.dprFloor);
    if(perf.down>40&&dpr>floor+.01){dpr=Math.max(floor,dpr*.82);resize();perf.down=perf.up=0;}
    else if(perf.up>420&&dpr<Q.dprCap-.01){dpr=Math.min(Q.dprCap,dpr*1.08+.01);resize();perf.down=perf.up=0;}
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=INK;ctx.fillRect(0,0,cw,ch);
  const s=Math.min(cw/1920,ch/1080),ox=(cw-1920*s)/2,oy=(ch-1080*s)/2;
  stageScale=s;

  if(mode==='idle'){
    drawIdle(now);
  }else{
    if(mode==='playing'&&silentMode&&retriesLeft>0&&now>=retryAt){
      retriesLeft--;retryAt=now+2.2;
      tryAudioSync();
      if(AC&&AC.state==='running'&&joinAudio())chip('SOUND ON',2.4);
    }

    let cand;
    if(silentMode||!AC){
      cand=now-wt0;
    }else if(AC.state==='running'){
      suspendedSince=null;
      cand=AC.currentTime-at0-avComp();
    }else{
      if(suspendedSince==null)suspendedSince=now;
      cand=vt;
    }
    if(cand<0)cand=0;
    vt=Math.max(vt,cand);
    const t=Math.min(DUR,vt);

    /* the bus meter + watchdog: sample the mix bus every frame */
    if(analyser){
      analyser.getByteTimeDomainData(awave);
      let pk=0;
      for(let i=0;i<awave.length;i+=4){
        const v=Math.abs(awave[i]-128)/128;
        if(v>pk)pk=v;
      }
      busPeak=Math.max(pk,busPeak*.88);
      if(mode==='playing'&&audioActive&&!silentMode&&!sawSignal){
        if(busPeak>.03)sawSignal=true;
        else if(t>1.5&&!noSignal){
          noSignal=true;
          console.error('Audio watchdog: the mix bus has carried no signal past t=1.5s — '+
            'scheduled events are not reaching the output. Check tab volume / output device.');
        }
      }
    }else busPeak*=.88;

    /* auto-open diagnostics once if sound failed — never suffer silently */
    if(mode==='playing'&&silentMode&&!diagAutoShown&&vt>2.2){
      diagAutoShown=true;
      if(!diagOpen)openDiag();
    }

    if(hapticsOn&&mode==='playing'&&t>prevT){
      for(const[ht,hp2]of HAPTICS){
        if(prevT<ht&&t>=ht){try{navigator.vibrate(hp2);}catch(_){}}
      }
    }
    prevT=t;

    ctx.save();
    ctx.beginPath();ctx.rect(ox,oy,1920*s,1080*s);ctx.clip();
    ctx.translate(ox,oy);ctx.scale(s,s);
    drawReel(t,now);
    ctx.restore();

    if(Math.abs(cw/1920-ch/1080)>.002){
      ctx.strokeStyle='rgba(242,239,230,.16)';ctx.lineWidth=1;
      ctx.strokeRect(ox+.5,oy+.5,1920*s-1,1080*s-1);
    }
    if(mode==='playing')drawOverlays(t,now);
    if(mode==='playing'&&vt>DUR+.35){
      mode='ended';
      document.body.classList.remove('playing');
      replayEl.classList.add('show');
      dropWakeLock();
      diagAutoShown=false;
    }
  }

  ctx.save();ctx.globalAlpha=Q.grainA;
  ctx.translate(-Math.random()*160,-Math.random()*160);
  ctx.fillStyle=grainPat;ctx.fillRect(0,0,cw+160,ch+160);
  ctx.restore();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
