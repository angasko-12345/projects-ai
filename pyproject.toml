# Repo-wide Ruff configuration. Every Python product in this repository is
# linted by one command (`ruff check .`), so the rules and their exceptions
# live here instead of in six copies.
#
# Why these rules: F (pyflakes) is the regression net that catches dead code
# -- a silently shadowed duplicate definition is F811 -- and B (bugbear) plus
# UP (pyupgrade) cover the bugs and dead syntax that tests do not see. E4/E7/
# E9 and W are the E/W basics: import placement, statement layout, syntax
# errors, and whitespace.
#
# E5 (line length) is deliberately not selected. `ruff format` (configured
# below, line-length 100) now covers agentops, ai-token-tracker, mini-llm,
# tools and the root scripts, but long strings and comments it does not wrap
# still leave E501 findings at 100 columns, most of them in the products the
# formatter excludes. Clear those before selecting E5.

[tool.ruff]
# Youngest interpreter any product supports (ai-token-tracker: 3.10+), so
# every UP suggestion is valid in every product. The lint job in CI runs on
# 3.12, which is only the linter's own interpreter.
target-version = "py310"

# Agent scratch trees hold full repo checkouts, venvs and evidence copies that
# are not repository source. Everything else (node_modules, dist, .git) is in
# Ruff's default exclude list.
extend-exclude = [".agents"]

# Most files are already written to ~100 columns; formatting to 100 rather than
# the 88 default keeps the one-time `ruff format` commit (listed in
# .git-blame-ignore-revs) as small as possible. Also the E501 limit if E5 is
# ever selected.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "W", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]

# Qt's model interfaces declare `parent: QModelIndex = QModelIndex()`: the
# empty index is the idiomatic "no parent" value, and B008's rewrite (None
# default plus a None check) would change a documented Qt signature.
"agentops/agentops/gui/widgets.py" = ["B008"]

# These suites insert their product root on sys.path before importing the
# package under test, so the imports genuinely cannot move above the
# insertion. The imports are still at module scope and run before any test.
"small-projects/mini-llm/tests/test_attention_sdpa.py" = ["E402"]
"small-projects/mini-llm/tests/test_checkpoint_rotation.py" = ["E402"]
"small-projects/mini-llm/tests/test_pipeline.py" = ["E402"]
"small-projects/mini-llm/tests/test_prepare_streaming.py" = ["E402"]

# pytest inserts the project root for tests; the fixture module follows the
# same path bootstrap before importing the app package.
"tiktok-slop-factory/tests/conftest.py" = ["E402"]

[tool.ruff.format]
# Formatted: agentops/, ai-token-tracker/, small-projects/mini-llm/, tools/ and
# the root .py files. Not formatted yet, on purpose: universal-game-agent has a
# draft PR stack in flight that a reformat would conflict with; qr-generator
# and tiktok-slop-factory await a decision on where they live; the privacy
# audit tool is out of this pass. Remove an entry here when that product is
# formatted (as its own formatting-only commit, added to .git-blame-ignore-revs).
exclude = [
    "universal-game-agent/**",
    "qr-generator/**",
    "tiktok-slop-factory/**",
    "small-projects/privacy_audit_tool/**",
    # Python files only: leave code blocks in Markdown and the Kaggle
    # notebook's JSON exactly as written.
    "*.md",
    "*.ipynb",
]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
