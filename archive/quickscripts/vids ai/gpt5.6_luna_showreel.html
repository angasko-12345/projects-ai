function sceneFinal(t){const u=t-27;const light=true;background(C.paper,t,true);const cx=560,cy=540,r=225;ctx.save();ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(cx+88,cy-35,r*.92,0,TAU);ctx.fill();ctx.restore();ctx.save();ctx.strokeStyle=C.violet;ctx.globalAlpha=.5;ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(cx,cy,430,138,-.18,0,TAU);ctx.stroke();ctx.restore();const a=u*1.52,ox=cx+430*Math.cos(a),oy=cy+138*Math.sin(a)*.98;glow(ox,oy,8+4*beat(u),C.lime,48,.98);for(let i=0;i<58;i++){const aa=a+i*.17,rr=510-i*6.5;circle(cx+Math.cos(aa)*rr*.72,cy+Math.sin(aa)*rr*.26,1.2,i%3?C.cyan:C.violet,.2)}const p=out(n(u,.06,.72));txy('GPT-5.6',980,360,110,C.ink,{alpha:p});txy('LUNA',980,525,190,C.violet,{alpha:p,shadow:'rgba(142,114,255,.28)',blur:28});line(990,645,1690,645,C.ink,2,.5);mxy('UNDERSTAND · SEE · INFER · USE TOOLS · CODE · CREATE · ADAPT',992,705,16,C.ink,{alpha:.74});mxy('CAPABILITY THROUGH MOTION / 30.000 S',992,754,13,C.violet,{alpha:.8});const q=out(n(u,1.35,2.15));if(q>0){mxy('READY FOR THE NEXT BRIEF',992,840,19,C.ink,{alpha:q});rect(1378,829,10,24,C.lime,.95,3)}const s=n(u,1.9,2.72);if(s>0)mxy('LUNA / GPT-5.6',992,888,13,C.ink,{alpha:.38+.35*s});const fp=out(n(u,2.0,2.95));line(250,956,250+1420*fp,956,C.violet,3,.68);circle(250+1420*fp,956,4,C.lime,.9);mxy('01',250,985,10,C.violet,{alpha:.45});mxy('09',1670,985,10,C.violet,{align:'right',alpha:.45})}

function render(t,wall){const S=stage();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=C.ink;ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(S.ox,S.oy);ctx.scale(S.s,S.s);let zoom=1+0.004*Math.sin(t*.9),rx=.002*Math.sin(t*.62),mx=2*Math.sin(t*.4),my=2*Math.cos(t*.53);if(t>=10&&t<14){const u=t-10;zoom+=.018*smoother(n(u,.1,2));rx+=.004*Math.sin(u)}if(t>=14&&t<18){const u=t-14;zoom+=.012*smoother(n(u,.2,2.8));mx+=5*Math.sin(u*1.3)}if(t>=21&&t<25){const u=t-21;zoom+=.012*Math.sin(u*2.4);rx+=.006*Math.sin(u*1.8)}if(t>=27){const u=t-27;zoom+=.009*(1-smoother(n(u,1.2,2.5)))}ctx.translate(960+mx,540+my);ctx.rotate(rx);ctx.scale(zoom,zoom);ctx.translate(-960,-540);if(t<3)sceneInput(t);else if(t<6)sceneLanguage(t);else if(t<10)sceneContext(t);else if(t<14)sceneVision(t);else if(t<18)sceneTools(t);else if(t<21)sceneCode(t);else if(t<25)sceneCreate(t);else if(t<27)sceneAdapt(t);else sceneFinal(t);const light=(t>=3&&t<6)||(t>=10&&t<14)||(t>=27);motif(t,light);transition(t);ctx.restore();if(Math.abs(vw/vh-W/H)>.01){ctx.strokeStyle='rgba(244,241,233,.18)';ctx.lineWidth=1;ctx.strokeRect(S.ox+.5,S.oy+.5,W*S.s-1,H*S.s-1)}chapterEl.textContent=chapterAt(t);const ui=light?C.ink:C.paper;document.getElementById('ui').style.color=ui;progressEl.style.background=ui;progressEl.style.width=(clamp(t/DUR)*100)+'%';
}

function initAudio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)throw new Error('Web Audio API unavailable');AC=new A();master=AC.createGain();master.gain.value=muted?0:.82;const comp=AC.createDynamicsCompressor();comp.threshold.value=-15;comp.knee.value=18;comp.ratio.value=8;comp.attack.value=.003;comp.release.value=.14;master.connect(comp);comp.connect(AC.destination);const analyser=AC.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.68;master.connect(analyser);master._analyser=analyser;noise=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return analyser}
function srcNoise(analyser,at,dur,amp=.1){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise;s.loop=true;f.type='highpass';f.frequency.value=2200;g.gain.setValueAtTime(amp,at);g.gain.exponentialRampToValueAtTime(.0001,at+dur);s.connect(f);f.connect(g);g.connect(master);s.start(at);s.stop(at+dur+.03)}
function tone(at,f,d=.1,a=.08,type='sine',to=null){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,at);if(to)o.frequency.exponentialRampToValueAtTime(to,at+d);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(a,at+.006);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(master);o.start(at);o.stop(at+d+.02)}
function impact(at,a=1){tone(at,150,.22,.4*a,'sine',44);tone(at,70,.34,.22*a,'triangle',34);srcNoise(null,at,.028,.16*a)}

let analyser=null;
async function start(forceSilent=false){
 if(mode==='playing')return;
 stateEl.classList.remove('show');
 if(forceSilent){silent=true;startWall=performance.now()/1000;visualTime=0;mode='playing';playEl.classList.add('hidden');return}
 try{if(!AC)analyser=initAudio();if(AC.state!=='running')await AC.resume();if(AC.state!=='running')throw new Error('AudioContext is not running');}catch(err){silent=true;stateTitle.textContent='Audio unavailable';stateBody.textContent='The synthesized score could not start. The reel can still play silently.';stateEl.classList.add('show');return}
 silent=false;startWall=performance.now()/1000;visualTime=0;AC._visualOrigin=AC.currentTime+.12;
 try{scheduleScore(AC._visualOrigin)}catch(err){console.error('Luna score scheduling failed',err);try{AC.close()}catch{}AC=null;analyser=null;silent=true;stateTitle.textContent='Audio score failed';stateBody.textContent='The score could not be scheduled. Use silent playback to continue.';stateEl.classList.add('show');return}
 mode='playing';playEl.classList.add('hidden');
}
async function replay(){mode='idle';silent=false;visualTime=0;playEl.classList.remove('hidden');progressEl.style.width='0%';if(AC){try{await AC.close()}catch{}AC=null;analyser=null}}
function toggleMute(){muted=!muted;if(master&&AC){try{master.gain.setTargetAtTime(muted?0:.82,AC.currentTime,.015)}catch{}}}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}}
cv.addEventListener('pointerdown',()=>{if(mode==='idle'||mode==='ended')start(false)});
silentBtn.addEventListener('click',e=>{e.stopPropagation();stateEl.classList.remove('show');start(true)});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(mode==='idle'||mode==='ended')start(false)}else if(e.key==='f'||e.key==='F'){fullscreen()}else if(e.key==='m'||e.key==='M'){toggleMute()}});
function loop(ms){requestAnimationFrame(loop);const wall=ms/1000;const dt=Math.min(.1,Math.max(0,wall-lastWall));lastWall=wall;let t=0;if(mode==='idle')t=0;else if(mode==='ended')t=DUR;else if(silent||!AC)t=wall-startWall;else if(AC.state==='running')t=AC.currentTime-AC._visualOrigin;else t=visualTime+dt;visualTime=Math.max(visualTime,t);t=clamp(visualTime,0,DUR);render(t,wall);if(mode==='playing'&&visualTime>=DUR+.2){mode='ended';playEl.classList.remove('hidden');playEl.querySelector('h1').textContent='REPLAY';playEl.querySelector('p').textContent='GPT-5.6 · LUNA';playEl.querySelector('.kbd').textContent='click anywhere to replay'}}
requestAnimationFrame(loop);
})();
