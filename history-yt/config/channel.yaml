niche: history
angle: ""
language: en
voice: en_US-lessac-medium
target_length_minutes: 12
words_per_minute: 150

script_templates:
  - name: origin_story
    sections: [origin, growth, turning_point, legacy]
  - name: conflict_resolution
    sections: [setup, conflict, escalation, resolution]
  - name: day_in_life_era
    sections: [morning, work, evening, what_changed]
  - name: rise_fall
    sections: [rise, peak, decline, fall]
  - name: mystery_evidence
    sections: [mystery, clues, evidence, verdict]
  - name: comparison
    sections: [side_a, side_b, comparison, conclusion]

thresholds:
  title_ngram_similarity: 0.7
  title_ngram: 3
  thumbnail_phash_distance: 8
  template_repeat_window: 5
  history_window: 10

tts:
  provider: fake  # fake | piper | elevenlabs
  pacing_min: 0.9
  pacing_max: 1.1
  piper_exe: piper
  model: ""
  elevenlabs_voice_id: "21m00Tcm4TlvDq8ikWAM"
  elevenlabs_model: "eleven_multilingual_v2"
  elevenlabs_output_format: "mp3_44100_128"

llm:
  provider: fake
  base_url: ""
  model: ""
  api_key_env: ""
  temperature: 0.7
  max_tokens: null

youtube:
  oauth_client_json: ""
  token_path: ""
  contains_synthetic_media: null

scene:
  # Style lock is copied into every scene record. Empty means not set, not guessed.
  style_lock: "engraved documentary, muted earth palette, soft rim light"
  period: ""
  location: ""

qa:
  profile: release  # structural | release
  loudness_lufs: -14.0
  loudness_tolerance: 1.0
  true_peak_max: -1.0

audio:
  normalize: true
  loudness_lufs: -14.0

visuals:
  # Archive fetch (visuals-fetch --all). Every provider is license-gated; these
  # thresholds only decide whether a candidate is usable, never what rights are.
  min_width: 1600
  min_height: 900
  min_hash_distance: 12   # reject near-duplicates of this video and recent runs
  max_downloads_per_scene: 3
  history_window: 10
  allow_placeholder_cards: false  # release builds must not ship debug cards

ai_image:
  provider: disabled

shorts:
  max_clips: 3
  min_seconds: 15
  max_seconds: 60

videos:
  width: 1920
  height: 1080
  fps: 30
